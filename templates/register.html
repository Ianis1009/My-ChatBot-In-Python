<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create account · Moto Garage</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='auth.css') }}"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <span class="auth-label">
                MOTO GARAGE
            </span>

            <h1>
                Create your account.
            </h1>

            <p>
                Join the garage.
            </p>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}


            <form method="POST">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    maxlength="80"
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    name="email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                    minlength="8"
                >


                <button type="submit">
                    Create account →
                </button>
            </form>
            <div class="auth-switch">
                Already have an account?
                <a href="{{ url_for('login') }}">
                    Sign in
                </a>
            </div>
        </div>
    </main>
</body>
</html>
