<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel | Voice Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="travel-page">

    <header class="travel-header">

        <a href="{{ url_for('index') }}" class="back-button">
            ← Assistant
        </a>

        <div>
            <span class="travel-label">TRAVEL MODE</span>
            <h1>Plan your route</h1>
            <p>Calculate routes between cities around the world.</p>
        </div>

    </header>


    <main class="travel-container">

        <section class="route-card">

            <div class="route-title">
                <span>✈</span>
                <div>
                    <h2>Route planner</h2>
                    <p>Enter two cities to calculate the route.</p>
                </div>
            </div>


            <form id="route-form" class="route-form">

                <div class="route-input">

                    <label for="origin">
                        From
                    </label>

                    <input
                        id="origin"
                        type="text"
                        placeholder="Bucharest"
                        autocomplete="off"
                        required
                    >

                </div>


                <div class="route-arrow">
                    →
                </div>


                <div class="route-input">

                    <label for="destination">
                        To
                    </label>

                    <input
                        id="destination"
                        type="text"
                        placeholder="Paris"
                        autocomplete="off"
                        required
                    >

                </div>


                <button
                    type="submit"
                    id="calculate-route"
                    class="route-button"
                >
                    Calculate route
                </button>

            </form>

        </section>


        <section
            id="route-result"
            class="route-result hidden"
        >

            <div class="route-result-header">

                <span class="success-icon">
                    ✓
                </span>

                <div>
                    <h2>Route calculated</h2>
                    <p id="route-summary"></p>
                </div>

            </div>


            <div class="route-stats">

                <div class="route-stat">

                    <span class="stat-icon">
                        ↔
                    </span>

                    <span class="stat-label">
                        Distance
                    </span>

                    <strong id="distance">
                        —
                    </strong>

                </div>


                <div class="route-stat">

                    <span class="stat-icon">
                        ⏱
                    </span>

                    <span class="stat-label">
                        Estimated time
                    </span>

                    <strong id="duration">
                        —
                    </strong>

                </div>

            </div>

        </section>


        <section
            id="route-error"
            class="route-error hidden"
        >
            <span>⚠</span>
            <p id="error-message"></p>
        </section>

    </main>

</div>


<script src="{{ url_for('static', filename='travel.js') }}"></script>

</body>
</html>
