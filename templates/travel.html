
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">

    <title>Travel | Python Voice Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="app">

        <!-- HEADER -->

        <header class="header">

            <div class="header-left">

                <div class="bot-avatar">
                    <span class="bot-avatar-icon">🤖</span>
                    <span class="avatar-glow"></span>
                </div>

                <div class="title">

                    <div class="title-row">
                        <h1>Voice Assistant</h1>
                        <span class="version">Version β</span>
                    </div>

                    <p>
                        <span class="header-subtitle-icon">✦</span>
                        Travel Mode
                    </p>

                </div>

            </div>

            <div class="header-right">

                <!-- VOICE -->

                <button
                    id="voice-toggle"
                    class="navbar-button voice-toggle"
                    type="button"
                    title="Mute voice"
                    aria-label="Mute voice"
                    aria-pressed="false"
                >
                    <span id="voice-toggle-icon" class="navbar-icon">🔊</span>
                    <span id="voice-toggle-text" class="navbar-button-text">Voice</span>
                </button>

                <!-- THEME -->

                <button
                    id="theme-toggle"
                    class="navbar-button theme-toggle"
                    type="button"
                    title="Switch to light mode"
                    aria-label="Switch to light mode"
                    aria-pressed="false"
                >
                    <span id="theme-toggle-icon" class="navbar-icon">☀️</span>
                    <span id="theme-toggle-text" class="navbar-button-text">Light</span>
                </button>

                <!-- STATUS -->

                <div class="status">
                    <span class="status-dot"></span>
                    <span>Online</span>
                </div>

            </div>

        </header>


        <!-- WORKSPACE -->

        <div class="workspace">

            <!-- SIDEBAR -->

            <aside class="mode-sidebar">

                <div class="sidebar-label">MODES</div>

                <a href="{{ url_for('index') }}" class="mode-button">
                    <span class="mode-icon">ℹ</span>
                    <span class="mode-name">Info</span>
                </a>

                <a href="{{ url_for('travel') }}" class="mode-button active">
                    <span class="mode-icon">✈</span>
                    <span class="mode-name">Travel</span>
                </a>

                <a href="{{ url_for('moto') }}" class="mode-button">
                    <span class="mode-icon">🏍</span>
                    <span class="mode-name">Moto</span>
                </a>

            </aside>


            <!-- TRAVEL CONTENT -->

            <main class="travel-page">

                <section class="travel-hero">

                    <div class="travel-icon">
                        ✈
                    </div>

                    <span class="travel-label">
                        TRAVEL MODE
                    </span>

                    <h2>
                        Where will you go?
                    </h2>

                    <p>
                        Your personal travel assistant is getting ready.
                        Discover destinations, plan routes and explore
                        new places.
                    </p>

                    <div class="travel-actions">

                        <button class="travel-card">
                            <span class="travel-card-icon">🌍</span>
                            <span>
                                <strong>Explore</strong>
                                <small>Discover destinations</small>
                            </span>
                        </button>

                        <button class="travel-card">
                            <span class="travel-card-icon">🗺️</span>
                            <span>
                                <strong>Plan a trip</strong>
                                <small>Build your itinerary</small>
                            </span>
                        </button>

                        <button class="travel-card">
                            <span class="travel-card-icon">📍</span>
                            <span>
                                <strong>Find places</strong>
                                <small>Search nearby locations</small>
                            </span>
                        </button>

                    </div>

                    <div class="travel-coming-soon">

                        <span>✦</span>

                        More travel features are coming soon.

                    </div>

                </section>

            </main>

        </div>


        <!-- USER AREA -->

        <div class="user-area">

            <button
                class="user-button"
                type="button"
                title="Account"
            >

                <span class="user-icon">👤</span>

                <span class="user-info">

                    <span class="user-name">Guest</span>

                    <span class="user-status">
                        Not logged in
                    </span>

                </span>

            </button>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
